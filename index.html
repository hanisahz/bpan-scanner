<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPHB Annual Dinner — Officer Check-in</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --green: #173f35;
            --green2: #245747;
            --bg: #f3f7f5;
            --border: #d7e3dd;
            --muted: #63756d;
            --red: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px 12px;
            background: var(--bg);
            color: #152c26;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .card {
            max-width: 650px;
            margin: auto;
            padding: 24px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(20, 50, 40, .05);
        }

        h1 {
            margin: 0 0 8px;
            color: var(--green);
            font-size: 28px;
        }

        .muted {
            color: var(--muted);
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #c7d7cf;
            border-radius: 12px;
            font-size: 17px;
        }

        button {
            padding: 14px 16px;
            border: 0;
            border-radius: 12px;
            background: var(--green);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:disabled {
            opacity: .55;
            cursor: wait;
        }

        .full {
            width: 100%;
            margin-top: 12px;
        }

        .secondary {
            background: #e6efea;
            color: var(--green);
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 13px;
            border-radius: 12px;
            overflow-wrap: anywhere;
            line-height: 1.45;
        }

        .error {
            display: block;
            color: var(--red);
            background: #fff0ef;
            border: 1px solid #fecdca;
        }

        .success {
            display: block;
            color: var(--green);
            background: #e9f6ef;
            border: 1px solid #a7f3d0;
        }

        #reader {
            width: 100%;
            margin-top: 18px;
            overflow: hidden;
            border-radius: 14px;
            background: #000;
        }

        #reservation {
            display: none;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 18px 0;
        }

        .detail {
            background: #f5f8f6;
            padding: 13px;
            border-radius: 12px;
            overflow-wrap: anywhere;
        }

        .detail small {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
        }

        .person {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 15px 4px;
            border-bottom: 1px solid var(--border);
        }

        .person input[type="checkbox"] {
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            margin: 0;
            accent-color: var(--green);
        }

        .person label {
            margin: 0;
            flex: 1;
            cursor: pointer;
        }

        .person small {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-weight: 400;
        }

        .status {
            font-size: 12px;
            font-weight: 700;
            color: var(--green2);
        }

        .present {
            color: #18794e;
        }

        .summary {
            margin-top: 18px;
            padding: 14px;
            background: #f5f8f6;
            border-radius: 12px;
            line-height: 1.6;
            font-weight: 600;
        }

        @media (max-width: 420px) {
            .card {
                padding: 18px 14px;
            }

            h1 {
                font-size: 24px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            button {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Annual Dinner Check-in</h1>
        <p class="muted">
            Enter your Staff ID before scanning an attendee's QR pass.
        </p>

        <label for="staffId">Officer Staff ID</label>
        <input id="staffId" type="text" placeholder="Enter your Staff ID" autocomplete="off" required>

        <button id="startButton" class="full" type="button">
            Start QR Scanner
        </button>

        <button id="stopButton" class="full secondary" type="button" hidden>
            Stop Scanner
        </button>

        <div id="message" class="message" role="status"></div>
        <div id="reader"></div>

        <section id="reservation">
            <h2>Reservation Details</h2>

            <div class="details">
                <div class="detail">
                    <small>Employee</small>
                    <strong id="employeeName">-</strong>
                </div>
                <div class="detail">
                    <small>Employee number</small>
                    <strong id="employeeNumber">-</strong>
                </div>
                <div class="detail">
                    <small>Spouse</small>
                    <strong id="spouseName">-</strong>
                </div>
                <div class="detail">
                    <small>Table number</small>
                    <strong id="tableNumber">-</strong>
                </div>
            </div>

            <h3>Select attendees to check in</h3>
            <p class="muted">
                Tick each person who has arrived. Employees and spouses can be checked in separately.
            </p>

            <div id="attendeeList"></div>

            <button id="checkInButton" class="full" type="button">
                Confirm Check-in
            </button>

            <button id="scanNextButton" class="full secondary" type="button">
                Scan Next Pass
            </button>

            <div id="summary" class="summary" hidden></div>
        </section>
    </main>

    <script>
        // CONFIGURATION: Paste your Apps Script clean URL and API Secret here
        const CONFIG = {
            APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxZ3IyknfGQC8MQ7eV7k_c0nwcVZdjWyP66mzgGNrP0nCXOuLSoaam7uIahlAcii6rKXg/exec",
            API_SECRET: "AMQq9n7HGDy5URuOtYvwCP8egb6BaV0S" // Match the API_SECRET in Apps Script Properties
        };

        const staffInput = document.getElementById("staffId");
        const startButton = document.getElementById("startButton");
        const stopButton = document.getElementById("stopButton");
        const checkInButton = document.getElementById("checkInButton");
        const scanNextButton = document.getElementById("scanNextButton");
        const message = document.getElementById("message");
        const reservationPanel = document.getElementById("reservation");
        const attendeeList = document.getElementById("attendeeList");
        const summary = document.getElementById("summary");

        let scanner = null;
        let scannerRunning = false;
        let processing = false;
        let currentToken = "";
        let currentReservation = null;

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        function clearMessage() {
            message.textContent = "";
            message.className = "message";
        }

        function getStaffId() {
            const id = staffInput.value.trim();
            if (!id) {
                showMessage("Please enter your Staff ID first.", "error");
                staffInput.focus();
                return "";
            }
            return id;
        }

        function setDetails(data) {
            document.getElementById("employeeName").textContent = data.employeeName || "-";
            document.getElementById("employeeNumber").textContent = data.employeeNumber || "-";
            document.getElementById("spouseName").textContent = data.spouseName || "No spouse registered";
            document.getElementById("tableNumber").textContent = data.tableNumber || "-";
        }

        function renderAttendees(attendees) {
            attendeeList.replaceChildren();

            attendees.forEach(person => {
                const row = document.createElement("div");
                row.className = "person";

                const isPresent = person.status === "PRESENT";
                const label = document.createElement("label");

                if (!isPresent) {
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.id = "att-" + person.attendeeId;
                    checkbox.value = person.attendeeId;
                    checkbox.checked = false;

                    label.htmlFor = checkbox.id;
                    row.appendChild(checkbox);
                } else {
                    row.style.opacity = "0.75";
                }

                const name = document.createElement("strong");
                name.textContent = person.name;

                const info = document.createElement("small");
                info.textContent = person.type + " · Table " + (person.tableNumber || "-");

                label.append(name, info);

                const status = document.createElement("span");
                status.className = "status" + (isPresent ? " present" : "");
                status.textContent = isPresent ? "PRESENT" : "PENDING";

                row.append(label, status);
                attendeeList.appendChild(row);
            });
        }

        async function callApi(action, payload) {
            const bodyData = {
                action: action,
                apiSecret: CONFIG.API_SECRET,
                ...payload
            };

            // Send request to Apps Script using text/plain to comply with Apps Script CORS behavior
            const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(bodyData),
                redirect: "follow"
            });

            const text = await res.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                throw new Error("Invalid response received from backend server.");
            }

            if (!data.success) {
                throw new Error(data.error || "Backend request failed.");
            }
            return data.data;
        }

        async function stopScanner() {
            if (!scanner || !scannerRunning) return;
            try {
                await scanner.stop();
            } catch (e) {
                // Ignore stop errors
            }
            scannerRunning = false;
            stopButton.hidden = true;
            startButton.disabled = false;
        }

        async function startScanner() {
            const staffId = getStaffId();
            if (!staffId) return;

            clearMessage();

            if (typeof Html5Qrcode === "undefined") {
                showMessage("The QR scanner library could not load. Check network connection and reload.", "error");
                return;
            }

            try {
                startButton.disabled = true;

                if (!scanner) {
                    scanner = new Html5Qrcode("reader");
                }

                await scanner.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 240, height: 240 },
                        aspectRatio: 1.0
                    },
                    async decodedText => {
                        if (processing) return;

                        processing = true;
                        currentToken = decodedText.trim();

                        await stopScanner();
                        showMessage("QR detected. Verifying pass...", "success");

                        try {
                            const data = await callApi("inspectToken", {
                                token: currentToken,
                                staffId: getStaffId()
                            });

                            currentReservation = data;
                            setDetails(data);
                            renderAttendees(data.attendees || []);
                            reservationPanel.style.display = "block";
                            summary.hidden = true;
                            showMessage("Pass verified. Select attendees who arrived.", "success");
                        } catch (err) {
                            currentToken = "";
                            showMessage(err.message || "Unable to verify this QR pass.", "error");
                        } finally {
                            processing = false;
                        }
                    },
                    () => {
                        // Frame decode failures ignored
                    }
                );

                scannerRunning = true;
                stopButton.hidden = false;
                showMessage("Scanner ready. Point camera at attendee QR code.", "success");
            } catch (err) {
                showMessage("Could not access camera. Ensure HTTPS and grant permissions. " + (err.message || ""), "error");
                startButton.disabled = false;
            }
        }

        startButton.addEventListener("click", startScanner);

        stopButton.addEventListener("click", async () => {
            await stopScanner();
            showMessage("Scanner stopped.", "success");
        });

        checkInButton.addEventListener("click", async () => {
            const staffId = getStaffId();
            if (!staffId) return;

            if (!currentToken || !currentReservation) {
                showMessage("Scan a valid QR pass first.", "error");
                return;
            }

            const selected = Array.from(
                attendeeList.querySelectorAll('input[type="checkbox"]:checked')
            ).map(el => el.value);

            if (!selected.length) {
                showMessage("Select at least one attendee to check in.", "error");
                return;
            }

            checkInButton.disabled = true;
            checkInButton.textContent = "Processing...";

            try {
                const data = await callApi("checkIn", {
                    token: currentToken,
                    attendeeIds: selected,
                    staffId: staffId
                });

                renderAttendees(data.attendees || []);

                const lines = (data.results || []).map(item =>
                    item.name + ": " + item.status.replace(/_/g, " ")
                );

                summary.textContent = lines.join(" · ");
                summary.hidden = false;
                showMessage("Check-in request completed successfully.", "success");
            } catch (err) {
                showMessage(err.message || "Check-in failed. Please try again.", "error");
            } finally {
                checkInButton.disabled = false;
                checkInButton.textContent = "Confirm Check-in";
            }
        });

        scanNextButton.addEventListener("click", async () => {
            await stopScanner();

            currentToken = "";
            currentReservation = null;
            reservationPanel.style.display = "none";
            attendeeList.replaceChildren();
            summary.hidden = true;
            summary.textContent = "";
            clearMessage();

            startButton.disabled = false;
            startButton.click();
        });
    </script>
</body>

</html>
